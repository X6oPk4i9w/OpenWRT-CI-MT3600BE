# CI项目
name: MT3600BE

# ============================================================
# CI触发方式
# ============================================================

on:

  # 自动编译
  # GitHub Actions cron 使用 UTC
  #
  # UTC 19:00
  # 北京时间 = 次日凌晨 03:00
  schedule:
    - cron: '0 19 * * *'

  # 手动编译
  workflow_dispatch:

    inputs:

      PACKAGE:
        description: '手动追加插件包，多个请用换行符隔开。'
        required: false
        type: string

      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

# ============================================================
# GitHub Actions 权限
# ============================================================

permissions: write-all

# ============================================================
# 防止两个编译任务同时运行
#
# 例如：
#
# 03:00 自动编译正在运行
#
# 此时你又手动点击 Run workflow
#
# 第二个任务会等待第一个完成
#
# 不会两个任务同时操作 Cache / Release
# ============================================================

concurrency:

  group: ${{ github.workflow }}

  # 不取消正在运行的任务
  # 后来的任务排队等待
  cancel-in-progress: false

# ============================================================
# CI任务
# ============================================================

jobs:

  config:

    name: MT3600BE

    # 调用公共编译核心
    uses: ./.github/workflows/WRT-CORE.yml

    with:

      # ======================================================
      # 编译配置
      # 对应：
      #
      # Config/MT3600BE.txt
      # ======================================================

      WRT_CONFIG: MT3600BE


      # ======================================================
      # 默认主题
      #
      # argon
      # aurora
      # ======================================================

      WRT_THEME: argon


      # ======================================================
      # 默认主机名
      # ======================================================

      WRT_NAME: GLMT3600BE_38


      # ======================================================
      # 默认WIFI名称
      #
      # 实际按频段区分的配置
      # 由 Files 内自定义脚本处理
      # ======================================================

      WRT_SSID: MT3600BE


      # ======================================================
      # WIFI密码
      # ======================================================

      WRT_WORD: ljx2026@.


      # ======================================================
      # LAN地址
      # ======================================================

      WRT_IP: 192.168.38.1


      # ======================================================
      # 登录密码提示
      #
      # 这里只作为 Release 信息显示
      # ======================================================

      WRT_PW: admin


      # ======================================================
      # ImmortalWrt 源码
      # ======================================================

      WRT_REPO: https://github.com/immortalwrt/immortalwrt.git


      # ======================================================
      # 源码分支
      # ======================================================

      WRT_BRANCH: openwrt-25.12


      # ======================================================
      # 源码名称
      # ======================================================

      WRT_SOURCE: immortalwrt/immortalwrt


      # ======================================================
      # 手动追加插件
      # ======================================================

      WRT_PACKAGE: ${{ inputs.PACKAGE }}


      # ======================================================
      # 测试模式
      #
      # true：
      # 只生成配置
      #
      # false：
      # 正常编译固件
      # ======================================================

      WRT_TEST: ${{ inputs.TEST }}
