      # ========================================================
      # 整理固件
      # ========================================================

      - name: Package Firmware
        shell: bash

        run: |

          set -euo pipefail

          cd ./wrt/

          # 创建上传目录
          mkdir -p ./upload/

          # ====================================================
          # 保存本次编译配置
          # ====================================================

          cp -f ./.config \
            ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt


          # ====================================================
          # 正常编译模式
          # ====================================================

          if [[ "$WRT_TEST" != 'true' ]]; then

            # ==================================================
            # 获取内核版本
            # ==================================================

            echo "WRT_KVER=$(find ./bin/targets/ \
              -type f \
              -name "*.manifest" \
              -exec grep -oP '^kernel - \K[\d\.]+' {} \; \
              | head -n 1)" >> "$GITHUB_ENV"


            # ==================================================
            # 获取 LuCI 插件列表
            # ==================================================

            echo "WRT_LIST=$(find ./bin/targets/ \
              -type f \
              -name "*.manifest" \
              -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; \
              | tr '\n' ' ')" >> "$GITHUB_ENV"


            # ==================================================
            # 删除不需要发布的文件
            # ==================================================

            find ./bin/targets/ \
              -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" \
              -exec rm -rf {} +


            # ==================================================
            # 找到当前设备固件并重新命名
            # ==================================================

            while IFS= read -r FILE; do

              [ -f "$FILE" ] || continue

              BASENAME=$(basename "$FILE")

              EXT="${BASENAME#*.}"

              NAME=$(echo "$BASENAME" \
                | grep -io "\($WRT_TARGET\).*" \
                | cut -d '.' -f 1 || true)

              # 如果没有匹配设备名
              # 就保持原文件名
              if [ -z "$NAME" ]; then
                continue
              fi

              NEW_FILE="${NAME}-${WRT_INFO}-${WRT_BRANCH}-${WRT_WIFI}-${WRT_DATE}.${EXT}"

              echo "重命名："
              echo "  $BASENAME"
              echo "  ↓"
              echo "  $NEW_FILE"

              mv -f "$FILE" "./upload/$NEW_FILE"

            done < <(
              find ./bin/targets/ \
                -type f \
                -iname "*$WRT_TARGET*"
            )


            # ==================================================
            # 剩余文件全部移动到 upload
            #
            # manifest
            # bl2
            # fip
            # bootloader
            # 等
            # ==================================================

            find ./bin/targets/ \
              -type f \
              -exec mv -f {} ./upload/ \;

          fi


          # ====================================================
          # 显示准备上传的文件
          # ====================================================

          echo
          echo "=================================================="
          echo "准备上传的文件"
          echo "=================================================="

          find ./upload/ \
            -maxdepth 1 \
            -type f \
            -printf '%f    %s bytes\n' \
            | sort

          echo "=================================================="


      # ========================================================
      # 检查固件是否真正生成
      #
      # 只在正常编译模式检查
      #
      # 如果没有 sysupgrade.bin
      # Actions 直接失败
      #
      # 不允许出现：
      #
      # 编译绿色
      # 但实际上没有路由器固件
      # ========================================================

      - name: Verify Firmware
        if: env.WRT_TEST != 'true'
        shell: bash

        run: |

          set -euo pipefail

          echo "=================================================="
          echo "检查 MT3600BE 固件"
          echo "=================================================="


          # ====================================================
          # upload目录必须存在
          # ====================================================

          if [ ! -d "./wrt/upload" ]; then

            echo "::error::upload 目录不存在！"

            exit 1

          fi


          # ====================================================
          # 检查 sysupgrade 固件
          # ====================================================

          SYSUPGRADE=$(find ./wrt/upload/ \
            -maxdepth 1 \
            -type f \
            -iname '*sysupgrade*.bin' \
            -print \
            -quit)


          if [ -z "$SYSUPGRADE" ]; then

            echo
            echo "::error::没有找到 sysupgrade.bin 固件！"
            echo
            echo "当前 upload 目录内容："

            find ./wrt/upload/ \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

            echo
            echo "固件发布已终止。"

            exit 1

          fi


          # ====================================================
          # 检查固件大小
          # ====================================================

          SIZE=$(stat -c%s "$SYSUPGRADE")


          # 小于1MB肯定异常
          if [ "$SIZE" -lt 1048576 ]; then

            echo "::error::sysupgrade 固件大小异常：${SIZE} bytes"

            exit 1

          fi


          echo
          echo "[OK] 找到 sysupgrade 固件："
          echo
          echo "$SYSUPGRADE"
          echo
          echo "大小：${SIZE} bytes"
          echo
          echo "固件检查通过。"
          echo
          echo "=================================================="


      # ========================================================
      # 发布 GitHub Release
      #
      # 不再使用 master
      # 固定到 v2.6.2
      #
      # fail_on_unmatched_files:
      #
      # 如果上传路径匹配不到文件
      # Actions 必须失败
      # ========================================================

      - name: Release Firmware

        uses: softprops/action-gh-release@v2.6.2

        with:

          tag_name: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.WRT_DATE }}

          files: ./wrt/upload/*.*

          # 找不到文件时直接失败
          fail_on_unmatched_files: true

          body: |


            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}

            配置：${{ env.WRT_CONFIG }}
            平台：${{ env.WRT_TARGET }}

            登录地址：${{ env.WRT_IP }}
            登录密码：${{ env.WRT_PW }}

            WIFI名称：${{ env.WRT_SSID }}
            WIFI密码：${{ env.WRT_WORD }}

            内核版本：${{ env.WRT_KVER }}
            插件列表：${{ env.WRT_LIST }}


      # ========================================================
      # 发布完成后二次验证
      #
      # 不只相信上传 Action 返回成功
      #
      # 再从 GitHub Release API 读取一次
      # 确认 Release 中真的存在 sysupgrade.bin
      # ========================================================

      - name: Verify Release Upload
        if: env.WRT_TEST != 'true'

        shell: bash

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          set -euo pipefail


          TAG="${WRT_CONFIG}-${WRT_INFO}-${WRT_BRANCH}-${WRT_DATE}"


          echo "=================================================="
          echo "验证 GitHub Release"
          echo "=================================================="
          echo
          echo "Tag：$TAG"
          echo


          # ====================================================
          # 读取 Release 中实际存在的附件
          # ====================================================

          ASSETS=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')


          echo "GitHub Release 中实际存在的附件："
          echo
          echo "$ASSETS"
          echo


          # ====================================================
          # Release 中必须存在 sysupgrade.bin
          # ====================================================

          if ! echo "$ASSETS" \
            | grep -qi 'sysupgrade.*\.bin$'; then

            echo
            echo "::error::GitHub Release 中没有找到 sysupgrade.bin！"
            echo
            echo "虽然前面的发布步骤执行完毕，"
            echo "但实际 Release 附件不完整。"

            exit 1

          fi


          echo
          echo "[OK] GitHub Release 中已经确认存在 sysupgrade.bin"
          echo
          echo "固件上传验证完成。"
          echo
          echo "=================================================="
