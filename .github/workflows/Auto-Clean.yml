# SPDX-License-Identifier: MIT

# MT3600BE 固件自动清理
name: Auto-Clean

on:
  # 每天北京时间 13:30 自动清理
  # GitHub Actions 使用 UTC
  # 05:30 UTC = 北京时间 13:30
  #
  # 不再放到凌晨5点，避免与凌晨3点开始的固件编译撞车
  schedule:
    - cron: '30 5 * * *'

  # 支持手动运行
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  auto_clean:
    name: Auto Clean
    runs-on: ubuntu-latest

    steps:
      - name: Clean old Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash

        run: |
          set -euo pipefail

          # ==================================================
          # 清理规则
          # ==================================================
          # 1. Latest Release 永远保留
          # 2. 最新10个 Release 永远保留
          # 3. 最近10天发布的 Release 永远保留
          # 4. 只有同时不满足上面条件的旧 Release 才删除
          #
          # 重要：
          # 必须按 publishedAt 排序
          # 绝对不要再使用 createdAt
          # ==================================================

          KEEP_COUNT=10
          KEEP_DAYS=10

          echo "=================================================="
          echo "          MT3600BE Release 自动清理"
          echo "=================================================="
          echo
          echo "保留规则："
          echo "  1. Latest Release 永远保留"
          echo "  2. 最新 ${KEEP_COUNT} 个 Release 永远保留"
          echo "  3. 最近 ${KEEP_DAYS} 天发布的 Release 永远保留"
          echo
          echo "=================================================="

          # 计算10天前的时间
          CUTOFF_TIME=$(date -u -d "${KEEP_DAYS} days ago" +%s)

          # ==================================================
          # 获取 Release
          #
          # 关键修复：
          # 使用 publishedAt，而不是 createdAt
          #
          # 并且明确按照 publishedAt 从新到旧排序
          # ==================================================

          mapfile -t RELEASES < <(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --exclude-drafts \
              --json tagName,publishedAt,isLatest \
              --jq 'sort_by(.publishedAt) | reverse | .[] | [.tagName, .publishedAt, .isLatest] | @tsv'
          )

          TOTAL=${#RELEASES[@]}

          echo
          echo "当前 Release 总数：${TOTAL}"
          echo

          # ==================================================
          # Release 数量不足10个
          # ==================================================

          if [ "$TOTAL" -le "$KEEP_COUNT" ]; then

            echo "[KEEP] 当前只有 ${TOTAL} 个 Release"
            echo "[KEEP] 未超过保底数量 ${KEEP_COUNT}"
            echo "[KEEP] 不删除任何固件"

            exit 0

          fi

          # ==================================================
          # 开始检查 Release
          # ==================================================

          for i in "${!RELEASES[@]}"; do

            INDEX=$((i + 1))

            IFS=$'\t' read -r TAG_NAME RELEASE_DATE IS_LATEST \
              <<< "${RELEASES[$i]}"

            echo
            echo "--------------------------------------------------"
            echo "序号：${INDEX}/${TOTAL}"
            echo "Tag ：${TAG_NAME}"
            echo "发布时间：${RELEASE_DATE}"

            # ==================================================
            # 第一层保护
            # Latest Release 永远不删除
            # ==================================================

            if [ "$IS_LATEST" = "true" ]; then

              echo "[KEEP] Latest Release"
              echo "[KEEP] 强制保留"

              continue

            fi

            # ==================================================
            # 第二层保护
            # 最新10个 Release 永远不删除
            # ==================================================

            if [ "$INDEX" -le "$KEEP_COUNT" ]; then

              echo "[KEEP] 属于最新 ${KEEP_COUNT} 个 Release"

              continue

            fi

            # ==================================================
            # 第三层保护
            # 最近10天发布的 Release 永远不删除
            # ==================================================

            RELEASE_TIME=$(date -u -d "$RELEASE_DATE" +%s)

            if [ "$RELEASE_TIME" -ge "$CUTOFF_TIME" ]; then

              echo "[KEEP] 发布时间没有超过 ${KEEP_DAYS} 天"

              continue

            fi

            # ==================================================
            # 删除真正的旧版本
            # ==================================================

            echo "[DELETE] Release 已超过 ${KEEP_DAYS} 天"
            echo "[DELETE] 并且不属于最新 ${KEEP_COUNT} 个"
            echo "[DELETE] 删除 Release + Tag：${TAG_NAME}"

            gh release delete "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes

          done

          echo
          echo "=================================================="
          echo "Release 清理完成"
          echo "=================================================="

      # ========================================================
      # 清理旧 Actions 运行记录
      #
      # 注意：
      # 这里绝对不允许删除 Release
      # Release 已经由上面的安全逻辑处理
      # ========================================================

      - name: Clean old Workflow Runs
        uses: ophub/delete-releases-workflows@main

        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}

          # 禁止这个 Action 删除 Release
          delete_releases: false

          # 只清理旧 Actions 运行记录
          delete_workflows: true

          # 保留10天
          workflows_keep_day: 10
