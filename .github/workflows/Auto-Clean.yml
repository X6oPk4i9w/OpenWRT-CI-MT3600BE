# SPDX-License-Identifier: MIT

# ============================================================
# MT3600BE 固件自动清理
# ============================================================

name: Auto-Clean


on:

  # ==========================================================
  # 每天北京时间 13:30 自动运行
  #
  # GitHub Actions 使用 UTC
  #
  # 05:30 UTC
  # =
  # 北京时间 13:30
  #
  # 固件每天北京时间 03:00 开始编译
  # 清理放到 13:30
  # 尽量避免与固件编译发生冲突
  # ==========================================================

  schedule:
    - cron: '30 5 * * *'


  # ==========================================================
  # 支持手动运行
  # ==========================================================

  workflow_dispatch:


# ============================================================
# 最小权限
# ============================================================

permissions:

  # 删除 Release / Tag
  contents: write

  # 删除旧 Workflow Runs
  actions: write


jobs:

  auto_clean:

    name: Auto Clean

    runs-on: ubuntu-latest


    steps:

      # ========================================================
      # 清理旧 Release
      # ========================================================

      - name: Clean old Releases

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


        shell: bash


        run: |

          set -euo pipefail


          # ====================================================
          # 清理规则
          # ====================================================
          #
          # 第一层保护：
          #
          #   Latest Release 永远保留
          #
          #
          # 第二层保护：
          #
          #   最新 10 个 Release 永远保留
          #
          #
          # 第三层保护：
          #
          #   最近 10 天发布的 Release 永远保留
          #
          #
          # 只有：
          #
          #   不是 Latest
          #
          #   并且
          #
          #   不属于最新 10 个
          #
          #   并且
          #
          #   发布时间超过 10 天
          #
          # 才会被删除
          #
          #
          # 重要：
          #
          #   必须按 publishedAt 排序
          #
          #   绝对不要使用 createdAt
          #
          #   createdAt 是被打 tag 的那个 commit 的时间，
          #   多个 Release 可能共享同一个 createdAt，
          #   排序结果不确定，会误删新固件
          # ====================================================

          KEEP_NUM=10
          KEEP_DAYS=10

          DELETE_COUNT=0
          KEEP_TOTAL=0
          DELETE_FAILED=0


          echo "=================================================="
          echo "        MT3600BE Release 自动清理"
          echo "=================================================="
          echo
          echo "保留规则："
          echo "  1. Latest Release 永远保留"
          echo "  2. 最新 ${KEEP_NUM} 个 Release 永远保留"
          echo "  3. 最近 ${KEEP_DAYS} 天发布的 Release 永远保留"
          echo
          echo "=================================================="


          CUTOFF_TIME="$(date -u -d "${KEEP_DAYS} days ago" +%s)"

          echo
          echo "当前 UTC 时间："
          date -u '+  %Y-%m-%d %H:%M:%S'
          echo
          echo "删除时间边界："
          date -u -d "@${CUTOFF_TIME}" '+  %Y-%m-%d %H:%M:%S'
          echo


          # ====================================================
          # 读取 Release 列表
          #
          # 直接捕获 gh 的退出码，
          # 把"调用失败"和"确实没有 Release"区分开
          # ====================================================

          echo "=================================================="
          echo "读取 GitHub Releases"
          echo "=================================================="
          echo

          if ! RELEASE_OUTPUT="$(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --exclude-drafts \
              --json tagName,publishedAt,isLatest \
              --jq 'sort_by(.publishedAt) | reverse | .[] | [.tagName, .publishedAt, .isLatest] | @tsv'
          )"; then

            echo
            echo "[ERROR] 获取 GitHub Release 列表失败"
            echo
            echo "[ERROR] 可能原因："
            echo "  - GitHub API 请求失败"
            echo "  - GITHUB_TOKEN 权限异常"
            echo "  - GitHub CLI 执行异常"
            echo "  - GitHub 服务暂时异常"
            echo
            echo "[ERROR] 为防止误删，本次立即终止"
            echo

            exit 1

          fi


          # ====================================================
          # 仓库确实没有任何 Release
          # ====================================================

          if [ -z "$RELEASE_OUTPUT" ]; then

            echo "[OK] GitHub Release 查询成功"
            echo
            echo "[KEEP] 当前仓库没有任何 Release"
            echo "[KEEP] 无需执行 Release 清理"
            echo

            exit 0

          fi


          mapfile -t RELEASES <<< "$RELEASE_OUTPUT"

          TOTAL="${#RELEASES[@]}"

          echo "[OK] GitHub Release 查询成功"
          echo
          echo "当前 Release 总数：${TOTAL}"
          echo


          # ====================================================
          # 查询上限告警
          #
          # --limit 1000 是一次查询能取到的上限，
          # 一旦触顶，更早的 Release 本次不会被看到
          # ====================================================

          if [ "$TOTAL" -ge 1000 ]; then

            echo "[WARN] Release 数量已达查询上限 1000"
            echo "[WARN] 更早的 Release 本次不会被处理"
            echo

          fi


          # ====================================================
          # 数量不足，直接退出
          # ====================================================

          if [ "$TOTAL" -le "$KEEP_NUM" ]; then

            echo "[KEEP] 当前只有 ${TOTAL} 个 Release"
            echo "[KEEP] 未超过最低保留数量 ${KEEP_NUM}"
            echo "[KEEP] 本次不删除任何 Release"
            echo

            exit 0

          fi


          # ====================================================
          # 逐个检查
          # ====================================================

          for i in "${!RELEASES[@]}"; do

            INDEX=$((i + 1))

            IFS=$'\t' read -r TAG_NAME RELEASE_DATE IS_LATEST \
              <<< "${RELEASES[$i]}"

            echo
            echo "--------------------------------------------------"
            echo "Release：${INDEX}/${TOTAL}"
            echo "Tag：${TAG_NAME}"
            echo "发布时间：${RELEASE_DATE}"
            echo "Latest：${IS_LATEST}"
            echo "--------------------------------------------------"


            # ==================================================
            # 兜底保护：Tag 为空
            # ==================================================

            if [ -z "${TAG_NAME:-}" ]; then

              echo "[WARN] Release Tag 为空"
              echo "[KEEP] 为防止误删，本条记录强制保留"

              KEEP_TOTAL=$((KEEP_TOTAL + 1))

              continue

            fi


            # ==================================================
            # 第一层保护
            # Latest Release 永远不删除
            # ==================================================

            if [ "${IS_LATEST:-false}" = "true" ]; then

              echo "[KEEP] Latest Release"
              echo "[KEEP] 强制保留"

              KEEP_TOTAL=$((KEEP_TOTAL + 1))

              continue

            fi


            # ==================================================
            # 第二层保护
            # 最新 10 个 Release 永远不删除
            # ==================================================

            if [ "$INDEX" -le "$KEEP_NUM" ]; then

              echo "[KEEP] 属于最新 ${KEEP_NUM} 个 Release"

              KEEP_TOTAL=$((KEEP_TOTAL + 1))

              continue

            fi


            # ==================================================
            # 兜底保护：发布时间为空
            # ==================================================

            if [ -z "${RELEASE_DATE:-}" ]; then

              echo "[WARN] publishedAt 为空"
              echo "[KEEP] 无法确认发布时间，为防止误删强制保留"

              KEEP_TOTAL=$((KEEP_TOTAL + 1))

              continue

            fi


            # ==================================================
            # 兜底保护：发布时间无法解析
            # ==================================================

            if ! RELEASE_TIME="$(
              date -u -d "$RELEASE_DATE" +%s 2>/dev/null
            )"; then

              echo "[WARN] 无法解析 publishedAt：${RELEASE_DATE}"
              echo "[KEEP] 为防止误删强制保留"

              KEEP_TOTAL=$((KEEP_TOTAL + 1))

              continue

            fi


            # ==================================================
            # 第三层保护
            # 最近 10 天发布的 Release 永远不删除
            # ==================================================

            if [ "$RELEASE_TIME" -ge "$CUTOFF_TIME" ]; then

              echo "[KEEP] 发布时间没有超过 ${KEEP_DAYS} 天"

              KEEP_TOTAL=$((KEEP_TOTAL + 1))

              continue

            fi


            # ==================================================
            # 删除真正的旧版本
            # ==================================================

            echo
            echo "[DELETE] 满足删除条件"
            echo "[DELETE] 已超过 ${KEEP_DAYS} 天"
            echo "[DELETE] 不属于最新 ${KEEP_NUM} 个"
            echo "[DELETE] 不是 Latest Release"
            echo
            echo "[DELETE] 删除 Release + Tag：${TAG_NAME}"
            echo

            if gh release delete "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes; then

              echo
              echo "[OK] 删除成功：${TAG_NAME}"

              DELETE_COUNT=$((DELETE_COUNT + 1))

            else

              echo
              echo "[ERROR] 删除失败：${TAG_NAME}"
              echo "[ERROR] 继续处理其他 Release"

              DELETE_FAILED=$((DELETE_FAILED + 1))

            fi

          done


          # ====================================================
          # 清理结果
          # ====================================================

          echo
          echo "=================================================="
          echo "             Release 清理结果"
          echo "=================================================="
          echo
          echo "Release 总数：${TOTAL}"
          echo "保留数量：${KEEP_TOTAL}"
          echo "成功删除：${DELETE_COUNT}"
          echo "删除失败：${DELETE_FAILED}"
          echo
          echo "=================================================="

          # ====================================================
          # 同时写入 Actions 运行摘要
          #
          # 这样在 Actions 页面不用展开日志，
          # 就能直接看到本次清理结果
          # ====================================================

          {
            echo "### MT3600BE Release 自动清理"
            echo
            echo "| 项目 | 数量 |"
            echo "| --- | ---: |"
            echo "| 清理前总数 | ${TOTAL} |"
            echo "| 保留 | ${KEEP_TOTAL} |"
            echo "| 成功删除 | ${DELETE_COUNT} |"
            echo "| 删除失败 | ${DELETE_FAILED} |"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          # ====================================================
          # 如果有 Release 删除失败
          #
          # 所有其他项目已经尽量处理完毕
          #
          # 最后再将当前步骤标记为失败
          # ====================================================

          if [ "$DELETE_FAILED" -gt 0 ]; then

            echo
            echo "[ERROR] 有 ${DELETE_FAILED} 个 Release 删除失败"
            echo "[ERROR] 请检查上面的日志"
            echo

            exit 1
          fi

          echo
          echo "[OK] Release 清理完成"
          echo


      # ========================================================
      # 清理旧 GitHub Actions Workflow Runs
      #
      # 注意：
      #
      # 第三方 Action 不允许删除任何 Release
      #
      # Release 只能由上面的安全逻辑处理
      # ========================================================

      - name: Clean old Workflow Runs

        # 即使上一步有 Release 删除失败，
        # Workflow Runs 的清理也要照常执行
        if: always()

        uses: ophub/delete-releases-workflows@main

        with:

          gh_token: ${{ secrets.GITHUB_TOKEN }}

          # 禁止这个 Action 删除任何 Release
          delete_releases: false

          # 只清理旧的 Actions 运行记录
          delete_workflows: true

          # Workflow Runs 保留 10 天
          workflows_keep_day: 10
